# ==============================================================================
# Medical Image Diagnosis & Anomaly Detection Platform
# Static Deployment Configuration
# Module 22 — Docker, Deployment & Production Packaging
# ==============================================================================

deployment:
  app_name: "Medical Image Diagnosis & Anomaly Detection Platform"
  version: "0.22.0.0"
  environment_default: "production"

network:
  api:
    default_host: "0.0.0.0"
    default_port: 8000
    docs_url: "/docs"
    openapi_url: "/openapi.json"
    liveness_url: "/health/liveness"
    readiness_url: "/health/readiness"
  gradio:
    default_host: "0.0.0.0"
    default_port: 7860

storage:
  database:
    driver: "sqlite"
    default_path: "data/medical_ai.db"
  logs:
    path: "logs/medical_ai_engine.log"
    rotation: "10 MB"
    retention: "30 days"
  outputs:
    path: "outputs/"

container:
  image_name: "medical-ai-platform"
  image_tag: "0.22.0.0"
  user: "medai"
  uid: 1001
  gid: 1001
  healthcheck:
    interval_seconds: 30
    timeout_seconds: 10
    retries: 3
    start_period_seconds: 40

services:
  modalities_supported:
    - brain_mri
    - brain_ct
    - chest_xray
    - retina
    - histopathology
    - skin
    - ultrasound
