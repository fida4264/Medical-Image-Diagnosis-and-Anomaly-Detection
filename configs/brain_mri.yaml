# =============================================================================
# configs/brain_mri.yaml
# Brain MRI Disease Analysis Framework — Configuration
# Module 7: Medical AI System
# =============================================================================

data:
  metadata_path: "metadata/master_metadata.csv"
  processed_images_dir: "processed_images"
  modality_filter: "brain_mri"             # Only brain_mri images are loaded
  splits_output_path: "metadata/brain_mri_splits.csv"
  label_map_output_path: "metadata/brain_mri_label_map.json"
  target_size: [224, 224]
  channels: 3
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  random_seed: 42
  num_workers: 4

model:
  backbone: "efficientnet_b0"              # Default backbone for Brain MRI
  pretrained: true
  freeze_backbone: false
  dropout_rate: 0.4
  use_batch_norm: true
  saved_model_dir: "saved_models/brain_mri"
  best_model_name: "best_model.pt"
  last_model_name: "last_model.pt"

training:
  epochs: 20
  batch_size: 32
  learning_rate: 0.0005
  weight_decay: 0.0001
  optimizer: "adamw"
  loss_function: "cross_entropy"
  scheduler: "reduce_on_plateau"
  patience: 5
  grad_clip: 1.0
  mixed_precision: true                    # torch.amp GradScaler — auto-disabled on CPU
  use_tensorboard: true
  tensorboard_log_dir: "saved_models/brain_mri/tensorboard_logs"

evaluation:
  output_dir: "saved_models/brain_mri/evaluation"
  classification_report_json: "saved_models/brain_mri/classification_report.json"
  confusion_matrix_png: "saved_models/brain_mri/confusion_matrix.png"
  roc_curves_dir: "saved_models/brain_mri/roc_curves"
  misclassified_dir: "saved_models/brain_mri/evaluation/misclassified"
  performance_report_md: "saved_models/brain_mri/evaluation/performance_report.md"

export:
  onnx_path: "saved_models/brain_mri/best_model.onnx"
  torchscript_path: "saved_models/brain_mri/best_model.torchscript"
  opset_version: 17

inference:
  reports_dir: "saved_models/brain_mri/reports"
  model_version: "0.7.0"
