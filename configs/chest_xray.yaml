# =============================================================================
# configs/chest_xray.yaml
# Chest X-ray Disease Analysis Framework — Configuration
# Module 8: Medical AI System
# =============================================================================

data:
  metadata_path: "metadata/master_metadata.csv"
  processed_images_dir: "processed_images"
  modality_filter: "chest_xray"           # Only chest_xray images are loaded
  splits_output_path: "metadata/chest_xray_splits.csv"
  label_map_output_path: "metadata/chest_xray_label_map.json"
  target_size: [224, 224]
  channels: 3
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  random_seed: 42
  num_workers: 4

model:
  backbone: "efficientnet_b0"
  pretrained: true
  freeze_backbone: false
  dropout_rate: 0.4
  use_batch_norm: true
  saved_model_dir: "saved_models/chest_xray"
  best_model_name: "best_model.pt"
  last_model_name: "last_model.pt"

training:
  epochs: 20
  batch_size: 32
  learning_rate: 0.0005
  weight_decay: 0.0001
  optimizer: "adamw"
  loss_function: "cross_entropy"
  scheduler: "reduce_on_plateau"
  patience: 5
  grad_clip: 1.0
  mixed_precision: true
  use_tensorboard: true
  tensorboard_log_dir: "saved_models/chest_xray/tensorboard_logs"

evaluation:
  output_dir: "saved_models/chest_xray/evaluation"
  classification_report_json: "saved_models/chest_xray/classification_report.json"
  confusion_matrix_png: "saved_models/chest_xray/confusion_matrix.png"
  roc_curves_dir: "saved_models/chest_xray/roc_curves"
  misclassified_dir: "saved_models/chest_xray/evaluation/misclassified"
  performance_report_md: "saved_models/chest_xray/evaluation/performance_report.md"

export:
  onnx_path: "saved_models/chest_xray/best_model.onnx"
  torchscript_path: "saved_models/chest_xray/best_model.torchscript"
  opset_version: 17

inference:
  reports_dir: "saved_models/chest_xray/reports"
  model_version: "0.8.0"
