# =============================================================================
# configs/retina.yaml
# Retina Disease Analysis Framework — Configuration
# Module 11: Medical AI System
# =============================================================================

data:
  metadata_path: "metadata/master_metadata.csv"
  processed_images_dir: "processed_images"
  splits_output_path: "metadata/retina_splits.csv"
  label_map_output_path: "metadata/retina_label_map.json"
  target_size: [224, 224]
  num_workers: 4
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15

model:
  backbone: "efficientnet_b0"
  pretrained: true
  dropout_rate: 0.4
  saved_model_dir: "saved_models/retina"

training:
  epochs: 30
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.0001
  patience: 7
  min_delta: 0.001
  use_amp: true
  scheduler: "cosine"
  warmup_epochs: 2

evaluation:
  output_dir: "outputs/retina"
  generate_roc: true
  generate_confusion_matrix: true
  generate_misclassified: true
  run_benchmark: true
  benchmark_iterations: 50

export:
  onnx_path: "saved_models/retina/best_model.onnx"
  torchscript_path: "saved_models/retina/best_model.torchscript"
  opset_version: 17

inference:
  reports_dir: "outputs/retina/reports"
  top_k: 3

severity:
  default_grade: "Grade 0: Normal / No Apparent Disease"
  grading_enabled: true
